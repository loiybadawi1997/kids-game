<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the game use the whole screen on phones with notches. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#87ceeb" />
    <!-- iPhone: run full screen when added to the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kids Town" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Kids Town</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Speech bubbles are drawn here, on top of the 3D view. -->
    <div id="bubbles"></div>

    <!-- A friendly hint until the first tap. -->
    <div id="hint" hidden>🕹️ Move the stick or 👆 tap to walk!<br /><small>Tap a friend to say hi 👋</small></div>

    <!-- Shown while the town is being built. -->
    <div id="loading">
      <div class="logo">🏡</div>
      <div class="title">Kids Town</div>
      <div class="bar"><div class="fill"></div></div>
    </div>

    <!-- Shown only when the phone is held upright (see style.css). -->
    <div id="rotate-hint">
      <div class="phone-icon">📱</div>
      <p>Turn your phone sideways</p>
    </div>

    <div id="fps" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
